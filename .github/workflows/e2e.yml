name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    name: E2E (Neovim ${{ matrix.neovim }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Verify Neovim version
        run: nvim --version | head -3

      - name: Make stubs executable
        run: chmod +x tests/fixtures/bin/*

      - name: Run E2E test suite
        run: |
          exit_code=0
          for spec in tests/e2e_smoke_test.lua tests/e2e/*.lua; do
            echo ""
            echo "::group::$(basename "$spec")"
            if nvim --headless -u tests/minimal_init.lua -l "$spec" 2>&1; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::FAILED: $spec"
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Run stage smoke tests
        if: always()
        run: |
          # Every scripts/test_*.lua runs automatically — a hardcoded allowlist
          # here let two scripts rot out of CI silently before (#403, #416).
          # These two are dofile'd helper libraries, not standalone tests: run
          # alone they do nothing (no assertions, exit 0), so they're excluded
          # explicitly rather than mistaken for passing coverage.
          exclude=(
            scripts/test_compose_form.lua
            scripts/test_real_git.lua
          )
          exit_code=0
          for t in scripts/test_*.lua; do
            skip=0
            for x in "${exclude[@]}"; do
              if [ "$t" = "$x" ]; then
                skip=1
                break
              fi
            done
            if [ "$skip" = "1" ]; then
              continue
            fi
            echo ""
            echo "::group::$(basename "$t")"
            if nvim --headless -u NONE -l "$t" 2>&1; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::FAILED: $t"
              exit_code=1
            fi
          done
          exit $exit_code
